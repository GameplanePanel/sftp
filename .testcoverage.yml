# Coverage threshold gate for the sftp module.
# Enforced in CI by Gameplane's shared go-component.yaml workflow (go-test-coverage/v2).
# main() is process wiring and is not unit-tested; the SSH server, API client
# and virtual file system are covered by their own package tests.
profile: coverage/unit.out
github-action-output: false

threshold:
  file: 0
  package: 0
  total: 70
